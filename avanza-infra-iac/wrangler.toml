# ============================================================
# PROJECT AVANZA / avanza-infra-iac / wrangler.toml
# Authoritative fleet deployment config. One codebase, two
# environments: --env primary = production edge brain;
# --env secondary = canary instance for pre-prod bundle tests.
# Deployed by .github/workflows/deploy-fleet.yml on every push.
# Shared bindings are top-level and inherited by both envs.
# ============================================================
name = "avanza-fleet"
main = "../avanza-edge-orchestrator/src/traffic_classifier.ts"
compatibility_date = "2026-10-15"
workers_dev = true

assets = { directory = "../avanza-edge-orchestrator/public", binding = "ASSETS", not_found_handling = "none" }

[observability]
enabled = true

[vars]
RADAR_REGION = "US-WA"
FLUSH_INTERVAL_MIN = "15"
AI_MODEL = "@cf/meta/llama-3.2-3b-instruct"
TURNSTILE_SITEKEY = ""
PUBLIC_BASE = ""

# ---- shared data plane (same ids in every env) ----
[[kv_namespaces]]
binding = "AVANZA_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[[d1_databases]]
binding = "AVANZA_HISTORY"
database_name = "avanza-history"
database_id = "REPLACE_WITH_D1_ID"

[[r2_buckets]]
binding = "AVANZA_R2"
bucket_name = "avanza-backups"

[[durable_objects.bindings]]
name = "AVANZA_STATE"
class_name = "AvanzaState"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AvanzaState"]

[ai]
binding = "AI"

[triggers]
crons = ["*/5 * * * *", "0 7 * * 1"]

# ---- environments ----
[env.primary]
[env.primary.vars]
AVANZA_DEVICE = "avanza-router"
FLEET_ROLE = "production"

[env.secondary]
[env.secondary.vars]
AVANZA_DEVICE = "avanza-router"
FLEET_ROLE = "canary"

# Secrets (once per env): wrangler secret put <NAME> --config avanza-infra-iac/wrangler.toml --env primary
#   AGENT_HMAC_KEY APP_CONTROL_KEY MCP_HMAC_KEY EXPO_ACCESS_TOKEN
#   RADAR_API_TOKEN TG_BOT_TOKEN TG_CHAT_ID TURNSTILE_SECRET
#   ACCOUNT_API_TOKEN IODA_API_URL
# The /mcp endpoint is served by this same worker (src/mcp_server.ts).
